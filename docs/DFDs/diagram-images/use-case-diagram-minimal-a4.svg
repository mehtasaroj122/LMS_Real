<svg xmlns="http://www.w3.org/2000/svg" width="3508" height="2480" viewBox="0 0 3508 2480">
  <style>
    .title {
      font: 700 56px Arial, Helvetica, sans-serif;
      fill: #111111;
    }
    .boundary-label {
      font: 700 30px Arial, Helvetica, sans-serif;
      fill: #111111;
    }
    .actor, .usecase-oval, .boundary, .connector {
      stroke: #111111;
      stroke-width: 6;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .actor-label {
      font: 700 42px Arial, Helvetica, sans-serif;
      fill: #111111;
    }
    .usecase-text {
      font: 700 38px Arial, Helvetica, sans-serif;
      fill: #0b7a37;
    }
  </style>

  <rect x="0" y="0" width="3508" height="2480" fill="#ffffff" />
  <text x="1754" y="72" text-anchor="middle" class="title">Library Management System - Simple Use Case Diagram</text>

  <rect x="760" y="140" width="2000" height="2160" class="boundary" />
  <text x="788" y="182" class="boundary-label">Library Management System</text>

  
    <g class="actor">
      <circle cx="250" cy="550" r="56" />
      <line x1="250" y1="606" x2="250" y2="810" />
      <line x1="155" y1="685" x2="345" y2="685" />
      <line x1="250" y1="810" x2="172" y2="980" />
      <line x1="250" y1="810" x2="328" y2="980" />
      <text x="250" y="1070" text-anchor="middle" class="actor-label">Student</text>
    </g>
    
  
    <g class="actor">
      <circle cx="250" cy="1520" r="56" />
      <line x1="250" y1="1576" x2="250" y2="1780" />
      <line x1="155" y1="1655" x2="345" y2="1655" />
      <line x1="250" y1="1780" x2="172" y2="1950" />
      <line x1="250" y1="1780" x2="328" y2="1950" />
      <text x="250" y="2040" text-anchor="middle" class="actor-label">Staff</text>
    </g>
    
  
    <g class="actor">
      <circle cx="3220" cy="980" r="56" />
      <line x1="3220" y1="1036" x2="3220" y2="1240" />
      <line x1="3125" y1="1115" x2="3315" y2="1115" />
      <line x1="3220" y1="1240" x2="3142" y2="1410" />
      <line x1="3220" y1="1240" x2="3298" y2="1410" />
      <text x="3220" y="1500" text-anchor="middle" class="actor-label">Admin</text>
    </g>
    

  
    <g>
      <ellipse cx="1760" cy="340" rx="260" ry="86" class="usecase-oval" />
      <text x="1760" y="354.0" text-anchor="middle" class="usecase-text">Login</text>
    </g>
    

  
    <g>
      <ellipse cx="1180" cy="760" rx="280" ry="86" class="usecase-oval" />
      <text x="1180" y="774.0" text-anchor="middle" class="usecase-text">Search Books</text>
    </g>
    
  
    <g>
      <ellipse cx="1180" cy="1080" rx="300" ry="96" class="usecase-oval" />
      <text x="1180" y="1094.0" text-anchor="middle" class="usecase-text">Request Book</text>
    </g>
    
  
    <g>
      <ellipse cx="1180" cy="1420" rx="360" ry="110" class="usecase-oval" />
      <text x="1180" y="1408.0" text-anchor="middle" class="usecase-text">View Books, Fines,</text><text x="1180" y="1460.0" text-anchor="middle" class="usecase-text">and Notifications</text>
    </g>
    

  
    <g>
      <ellipse cx="2320" cy="620" rx="290" ry="86" class="usecase-oval" />
      <text x="2320" y="634.0" text-anchor="middle" class="usecase-text">Manage Books</text>
    </g>
    
  
    <g>
      <ellipse cx="2320" cy="940" rx="330" ry="96" class="usecase-oval" />
      <text x="2320" y="954.0" text-anchor="middle" class="usecase-text">Approve Requests</text>
    </g>
    
  
    <g>
      <ellipse cx="2320" cy="1280" rx="360" ry="96" class="usecase-oval" />
      <text x="2320" y="1294.0" text-anchor="middle" class="usecase-text">Issue and Return Books</text>
    </g>
    
  
    <g>
      <ellipse cx="2320" cy="1680" rx="430" ry="120" class="usecase-oval" />
      <text x="2320" y="1668.0" text-anchor="middle" class="usecase-text">Manage Users, Fines,</text><text x="2320" y="1720.0" text-anchor="middle" class="usecase-text">Reports, and Settings</text>
    </g>
    

  <line x1="315" y1="585" x2="1490" y2="360" class="connector" />
  <line x1="315" y1="595" x2="910" y2="760" class="connector" />
  <line x1="315" y1="605" x2="880" y2="1080" class="connector" />
  <line x1="315" y1="615" x2="820" y2="1420" class="connector" />

  <line x1="315" y1="1550" x2="1485" y2="360" class="connector" />
  <line x1="315" y1="1560" x2="2000" y2="940" class="connector" />
  <line x1="315" y1="1570" x2="1960" y2="1280" class="connector" />
  <line x1="315" y1="1580" x2="1960" y2="1680" class="connector" />
  <line x1="315" y1="1590" x2="2050" y2="620" class="connector" />

  <line x1="3155" y1="1015" x2="2020" y2="360" class="connector" />
  <line x1="3155" y1="1025" x2="2610" y2="620" class="connector" />
  <line x1="3155" y1="1035" x2="2650" y2="940" class="connector" />
  <line x1="3155" y1="1045" x2="2690" y2="1280" class="connector" />
  <line x1="3155" y1="1055" x2="2750" y2="1680" class="connector" />
</svg>
