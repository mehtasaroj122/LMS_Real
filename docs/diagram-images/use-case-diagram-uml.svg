      <text x="1860" y="1378" text-anchor="middle" class="usecase-text">Send Email and</text><text x="1860" y="1422" text-anchor="middle" class="usecase-text">Notifications</text>
    </g>
    

  <line x1="285" y1="390" x2="820" y2="270" class="connector" />
  <line x1="285" y1="390" x2="835" y2="440" class="connector" />
  <line x1="285" y1="390" x2="825" y2="630" class="connector" />
  <line x1="285" y1="390" x2="790" y2="810" class="connector" />
