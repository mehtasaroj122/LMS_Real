      <text x="2330" y="968" text-anchor="middle" class="actor-label">Admin</text>
    </g>
    

  
    <g id="register">
      <ellipse cx="980" cy="250" rx="165" ry="64" class="usecase-oval" />
      <text x="980" y="228" text-anchor="middle" class="usecase-text">Complete</text><text x="980" y="272" text-anchor="middle" class="usecase-text">Invited Registration</text>
    </g>
    
  
    <g id="login">
      <ellipse cx="980" cy="430" rx="145" ry="58" class="usecase-oval" />
      <text x="980" y="440" text-anchor="middle" class="usecase-text">Login</text>
    </g>
    
  
    <g id="search_books">
      <ellipse cx="980" cy="620" rx="155" ry="58" class="usecase-oval" />
      <text x="980" y="630" text-anchor="middle" class="usecase-text">Search Books</text>
    </g>
    
  
    <g id="submit_request">
      <ellipse cx="980" cy="810" rx="180" ry="64" class="usecase-oval" />
