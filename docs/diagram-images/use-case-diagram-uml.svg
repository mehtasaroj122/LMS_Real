  <line x1="2270" y1="620" x2="1510" y2="1200" class="connector" />
  <line x1="2270" y1="620" x2="1920" y2="860" class="connector" />
  <line x1="2270" y1="620" x2="1920" y2="1060" class="connector" />
  <line x1="2270" y1="620" x2="1920" y2="1260" class="connector" />
  <line x1="2270" y1="620" x2="2015" y2="1400" class="connector" />

  
    <g>
      <line x1="1115" y1="980" x2="1185" y2="1400" class="connector" stroke-dasharray="14 10" marker-end="url(#openArrow)" />
      <text x="1150.0" y="1172.0" text-anchor="middle" class="relation-label">&lt;&lt;include&gt;&gt;</text>
