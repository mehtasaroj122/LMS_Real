<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1700" viewBox="0 0 2600 1700">
  <defs>
    <marker id="openArrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M1,1 L13,7 L1,13" fill="none" stroke="#111111" stroke-width="2.5"/>
    </marker>
  </defs>
  <style>
    .title {
      font: 700 34px Arial, Helvetica, sans-serif;
      fill: #111111;
    }
    .boundary-label {
      font: 700 28px Arial, Helvetica, sans-serif;
      fill: #111111;
    }
    .actor, .connector, .usecase-oval, .boundary {
      stroke: #111111;
      stroke-width: 5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .actor-label {
      font: 700 28px Arial, Helvetica, sans-serif;
      fill: #18a957;
    }
    .usecase-text {
      font: 700 28px Arial, Helvetica, sans-serif;
      fill: #18a957;
    }
    .relation-label {
      font: 700 24px Arial, Helvetica, sans-serif;
      fill: #18a957;
    }
  </style>
  <rect x="0" y="0" width="2600" height="1700" fill="#ffffff" />
  <text x="1300" y="42" text-anchor="middle" class="title">Library Management System - UML Use Case Diagram</text>
  <rect x="620" y="70" width="1450" height="1520" class="boundary" />
  <text x="652" y="112" class="boundary-label">Library Management System</text>

  
    <g class="actor">
      <circle cx="220" cy="370" r="38" />
      <line x1="220" y1="440" x2="220" y2="580" />
      <line x1="150" y1="490" x2="290" y2="490" />
      <line x1="220" y1="580" x2="165" y2="690" />
      <line x1="220" y1="580" x2="275" y2="690" />
      <text x="220" y="738" text-anchor="middle" class="actor-label">Student</text>
    </g>
    
  
    <g class="actor">
      <circle cx="220" cy="900" r="38" />
      <line x1="220" y1="970" x2="220" y2="1110" />
      <line x1="150" y1="1020" x2="290" y2="1020" />
      <line x1="220" y1="1110" x2="165" y2="1220" />
      <line x1="220" y1="1110" x2="275" y2="1220" />
      <text x="220" y="1268" text-anchor="middle" class="actor-label">Staff</text>
    </g>
    
  
    <g class="actor">
      <circle cx="2330" cy="600" r="38" />
      <line x1="2330" y1="670" x2="2330" y2="810" />
      <line x1="2260" y1="720" x2="2400" y2="720" />
