  <line x1="285" y1="920" x2="1195" y2="760" class="connector" />
  <line x1="285" y1="920" x2="1225" y2="980" class="connector" />
  <line x1="285" y1="920" x2="1220" y2="1200" class="connector" />
  <line x1="285" y1="920" x2="1620" y2="860" class="connector" />

  <line x1="2270" y1="620" x2="1910" y2="250" class="connector" />
  <line x1="2270" y1="620" x2="1910" y2="450" class="connector" />
  <line x1="2270" y1="620" x2="1930" y2="650" class="connector" />
  <line x1="2270" y1="620" x2="1510" y2="760" class="connector" />
