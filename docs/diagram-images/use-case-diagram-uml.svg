    <g id="manage_fines">
      <ellipse cx="1760" cy="860" rx="145" ry="58" class="usecase-oval" />
      <text x="1760" y="870" text-anchor="middle" class="usecase-text">Manage Fines</text>
    </g>
    
  
    <g id="reports">
      <ellipse cx="1760" cy="1060" rx="150" ry="58" class="usecase-oval" />
      <text x="1760" y="1070" text-anchor="middle" class="usecase-text">Generate Reports</text>
    </g>
    
  
    <g id="settings">
      <ellipse cx="1760" cy="1260" rx="150" ry="58" class="usecase-oval" />
      <text x="1760" y="1270" text-anchor="middle" class="usecase-text">Update Settings</text>
