<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1d4ed8">
    <title>Offline - Library Management System</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #dbe2ea;
            --primary: #1d4ed8;
            --primary-strong: #0f766e;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #020617;
                --surface: #0f172a;
                --text: #f8fafc;
                --muted: #94a3b8;
                --border: #334155;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(29, 78, 216, 0.16), transparent 32%),
                radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.18), transparent 30%),
                var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(100%, 420px);
            border: 1px solid var(--border);
            border-radius: 22px;
            background: color-mix(in srgb, var(--surface) 92%, transparent);
            padding: 28px;
            box-shadow: 0 28px 80px -54px rgba(15, 23, 42, 0.55);
            text-align: center;
        }

        img {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            object-fit: cover;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.45rem, 5vw, 2rem);
            line-height: 1.15;
        }

        p {
            margin: 14px 0 0;
            color: var(--muted);
            line-height: 1.65;
            font-size: 0.96rem;
        }

        button,
        a {
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 22px;
            border-radius: 999px;
            padding: 0 18px;
            border: 0;
            color: #ffffff;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="/pwa/icons/maskable-192x192.png" alt="Library Management System logo">
        <h1>You are offline</h1>
        <p>The app shell is ready, but this page needs a network connection. Reconnect and try again.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
